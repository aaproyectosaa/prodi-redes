<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Prodi Chat</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; }
      main { min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center;
        padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px); }
      .burbuja { width: 72px; height: 72px; border-radius: 22px; background: #6f40fc; display: flex; align-items: center; justify-content: center; font-size: 34px; }
      h1 { margin: 6px 0 0; font-size: 21px; }
      p { margin: 0; color: #a1a1aa; font-size: 15px; max-width: 280px; line-height: 1.4; }
      button { margin-top: 10px; border: 0; border-radius: 14px; background: #6f40fc; color: #fff; font-size: 16px; font-weight: 600; padding: 14px 28px; }
      button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <main>
      <div class="burbuja" aria-hidden="true">📶</div>
      <h1>Sin conexión</h1>
      <p>No pudimos abrir Prodi Chat. Revisá el wifi o los datos y probá de nuevo.</p>
      <button type="button" onclick="reintentar()">Reintentar</button>
    </main>
    <script>
      function reintentar() {
        location.href = "https://prodi-chat.vercel.app/chat-app";
      }
      // Vuelve sola apenas hay conexión.
      addEventListener("online", reintentar);
    </script>
  </body>
</html>
