<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Gothic"; src: url("assets/fonts/GOTHIC.TTF"); font-weight: 300 400; }
      @font-face { font-family: "Gothic"; src: url("assets/fonts/GOTHICB.TTF"); font-weight: 600 900; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0b0b; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Gothic", sans-serif; color: #fff; }
      .esc { position: absolute; inset: 0; overflow: hidden; }
      .full { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .toma { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
      .l { display: inline-block; }

      /* 1. gancho */
      #s1 { background: #000; }
      #pelo { object-position: 50% 30%; filter: brightness(0.55); }
      #gancho { position: absolute; left: 0; right: 0; top: 1080px; text-align: center; perspective: 900px; }
      #gancho div { font-size: 150px; font-weight: 700; line-height: 1.05; text-shadow: 0 10px 40px rgba(0,0,0,0.5); }

      /* 2. logo */
      #s2 { background: radial-gradient(60% 40% at 50% 42%, #3a3632 0%, #0b0b0b 75%); }
      .cam { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 42%; }
      .mundo { position: absolute; left: 540px; width: 0; height: 0; transform-style: preserve-3d; }
      .p3d { position: absolute; left: -150px; top: -191px; width: 300px; height: 382px; transform-style: preserve-3d; }
      .p3d img { position: absolute; inset: 0; width: 100%; height: 100%; }
      .marca { position: absolute; left: 0; right: 0; text-align: center; font-size: 104px; letter-spacing: 0.18em; text-indent: 0.18em; }
      .bajada { position: absolute; left: 0; right: 0; text-align: center; font-size: 34px; letter-spacing: 0.5em; text-indent: 0.5em; color: rgba(255,255,255,0.75); }

      /* títulos sobre las tomas */
      .titulo { position: absolute; left: 60px; right: 60px; top: 280px; text-align: center; font-size: 140px; font-weight: 700; line-height: 1; text-shadow: 0 6px 30px rgba(255,255,255,0.35); }
      .titulo.chica { font-size: 84px; white-space: nowrap; }
      #amino-tit { position: absolute; left: 0; right: 0; top: 280px; text-align: center; font-size: 140px; line-height: 1; text-shadow: 0 0 40px rgba(224,33,138,0.9); }
      #amino-tit b { font-weight: 700; } #amino-tit i { font-style: normal; font-weight: 300; }
      #pasos { position: absolute; left: 80px; top: 640px; display: flex; flex-direction: column; gap: 30px; }
      #pasos span { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 72px; font-weight: 700; background: rgba(255,255,255,0.12); border: 3px solid #ff5fc0; box-shadow: 0 0 30px rgba(224,33,138,0.7); }
      #pasos-txt { position: absolute; left: 0; right: 0; top: 1330px; text-align: center; font-size: 58px; padding: 18px 0; background: linear-gradient(90deg, transparent, rgba(10,5,16,0.75), transparent); font-weight: 700; text-shadow: 0 0 30px rgba(224,33,138,0.8); }
      #cont { position: absolute; left: 50%; top: 420px; transform: translateX(-50%); display: flex; align-items: center; gap: 22px; padding: 10px 40px; border-radius: 30px; background: rgba(20,25,30,0.78); color: #fff; white-space: nowrap; }
      #cont .a { font-size: 40px; letter-spacing: 0.12em; }
      #cont .n { display: inline-block; width: 140px; text-align: center; font-size: 170px; font-weight: 700; line-height: 1.05; color: #9fe2e6; }
      #cont .b { font-size: 48px; font-weight: 700; letter-spacing: 0.15em; }
      #blond-nom { position: absolute; left: 0; right: 0; top: 280px; text-align: center; font-size: 96px; font-weight: 700; letter-spacing: 0.06em; color: #1d2328; }

      /* 6. cierre */
      #s6 { background: radial-gradient(80% 55% at 50% 40%, #2a2724 0%, #0b0b0b 70%); }
      #web { position: absolute; left: 0; right: 0; top: 820px; text-align: center; font-size: 44px; }
      #web b { font-weight: 700; }
      #fila { position: absolute; left: 90px; right: 90px; top: 1010px; height: 470px; display: flex; justify-content: center; align-items: flex-end; gap: 10px; }
      #fila img { height: 400px; filter: drop-shadow(0 24px 30px rgba(0,0,0,0.6)); }
      #fila img.jar { height: 250px; }

      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
      #negro { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.6" data-width="1080" data-height="1920">
      <audio id="mezcla" src="assets/mezcla.m4a" data-start="0" data-duration="15.6" data-track-index="9"></audio>

      <!-- 1. gancho -->
      <div id="s1" class="esc clip" data-start="0" data-duration="1.75" data-track-index="0" data-layout-ignore>
        <img id="pelo" class="full" src="assets/p03_0.png" />
        <div id="gancho"><div>¿Tu pelo</div><div>pide más?</div></div>
      </div>

      <!-- 2. logo -->
      <div id="s2" class="esc clip" data-start="1.75" data-duration="1.0" data-track-index="0" data-layout-ignore>
        <div class="cam"><div class="mundo" style="top: 760px"><div class="p3d" id="p-a"></div></div></div>
        <div class="marca" id="marca-a" style="top: 1010px">PROTENAT</div>
        <div class="bajada" id="bajada-a" style="top: 1160px">PROFESSIONAL CARE</div>
      </div>

      <!-- 3. cuidados: tomas 3D generadas -->
      <video id="v-color" class="toma clip" src="assets/c-color.mp4" muted data-start="2.75" data-duration="0.87" data-track-index="0"></video>
      <video id="v-nutri" class="toma clip" src="assets/c-nutricion.mp4" muted data-start="3.62" data-duration="1.06" data-track-index="0"></video>
      <video id="v-fuerza" class="toma clip" src="assets/c-fuerza.mp4" muted data-start="4.68" data-duration="0.57" data-track-index="0"></video>
      <video id="v-kera" class="toma clip" src="assets/c-keratina.mp4" muted data-start="5.25" data-duration="0.45" data-track-index="0"></video>
      <div class="titulo clip" id="t-color" style="color:#5b3a99" data-start="2.75" data-duration="0.87" data-track-index="1">Color</div>
      <div class="titulo clip" id="t-nutri" style="color:#c63d12" data-start="3.62" data-duration="1.06" data-track-index="1">Nutrición</div>
      <div class="titulo clip" id="t-fuerza" style="color:#16807b" data-start="4.68" data-duration="0.57" data-track-index="1">Fuerza</div>
      <div class="titulo chica clip" id="t-kera" style="color:#c25e10" data-start="5.25" data-duration="0.45" data-track-index="1">Keratina &amp; Argán</div>

      <!-- 4. aminofusión -->
      <video id="v-amino" class="toma clip" src="assets/c-amino.mp4" muted data-start="5.7" data-duration="3.1" data-track-index="0"></video>
      <div id="s4" class="esc clip" data-start="5.7" data-duration="3.1" data-track-index="1" data-layout-ignore>
        <div id="amino-tit"><b>amino</b><i>fusión</i></div>
        <div id="pasos-txt">Repara en 4 pasos</div>
        <div id="pasos"><span>1</span><span>2</span><span>3</span><span>4</span></div>
      </div>

      <!-- 5. blondifix -->
      <video id="v-blond" class="toma clip" src="assets/c-blondifix.mp4" muted data-start="8.8" data-duration="3.25" data-track-index="0"></video>
      <div id="s5" class="esc clip" data-start="8.8" data-duration="3.25" data-track-index="1" data-layout-ignore>
        <div id="cont"><div class="a">ACLARA HASTA</div><div class="n" id="num">1</div><div class="b">NIVELES</div></div>
        <div id="blond-nom">BLONDIFIX</div>
      </div>

      <!-- 6. cierre -->
      <div id="s6" class="esc clip" data-start="12.05" data-duration="3.55" data-track-index="0" data-layout-ignore>
        <div class="cam"><div class="mundo" style="top: 470px"><div class="p3d" id="p-b" style="transform: scale(0.75)"></div></div></div>
        <div class="marca" id="marca-b" style="top: 640px">PROTENAT</div>
        <div class="bajada" id="bajada-b" style="top: 770px">CUIDADO PROFESIONAL</div>
        <div id="web">www.<b>protenat</b>.com.ar</div>
        <div id="fila">
          <img src="assets/p07_3.png" /><img src="assets/p09_3.png" /><img src="assets/p19_1.png" style="height:380px" /><img class="jar" src="assets/p22_0.png" /><img src="assets/p11_1.png" /><img src="assets/p13_1.png" />
        </div>
      </div>

      <div id="flash" class="clip" data-start="0" data-duration="15.6" data-track-index="2" data-layout-ignore></div>
      <div id="negro" class="clip" data-start="0" data-duration="15.6" data-track-index="3" data-layout-ignore></div>
    </div>

    <script>
      const T = { logo: 1.75, lineas: [2.75, 3.62, 4.68, 5.25], amino: 5.7, pasos: 7.0, blond: 8.8, nueve: 10.8, fin: 12.05, total: 15.6 };
      const tl = gsap.timeline({ paused: true });
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const letras = (el) => { el.innerHTML = [...el.textContent].map((c) => `<span class="l">${c === " " ? "&nbsp;" : c}</span>`).join(""); return $$(".l", el); };
      const flash = (t, o = 0.75) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, t);

      // logo P con volumen: capas apiladas
      function pe(el) {
        for (let i = 13; i >= 0; i--) {
          const im = document.createElement("img"); im.src = "assets/logo-p.png";
          Object.assign(im.style, { transform: `translateZ(${-i * 2.6}px)`, filter: `brightness(${i === 0 ? 1.15 : 0.32 + 0.02 * (13 - i)})` });
          el.appendChild(im);
        }
      }
      pe($("#p-a")); pe($("#p-b"));

      // 1. gancho
      tl.fromTo("#pelo", { scale: 1.3 }, { scale: 1.08, duration: 1.75, ease: "power2.out" }, 0);
      $$("#gancho div").forEach((d, i) => tl.fromTo(letras(d), { opacity: 0, rotationX: -100, y: 60 }, { opacity: 1, rotationX: 0, y: 0, duration: 0.4, stagger: 0.03, ease: "back.out(2)" }, 0.1 + i * 0.35));

      // 2. logo
      flash(T.logo, 0.9);
      tl.fromTo("#p-a", { rotationY: -200, z: -900 }, { rotationY: 0, z: 0, duration: 0.8, ease: "expo.out" }, T.logo)
        .fromTo(letras($("#marca-a")), { opacity: 0, z: 400, rotationY: 60, transformPerspective: 800 }, { opacity: 1, z: 0, rotationY: 0, duration: 0.4, stagger: 0.04, ease: "expo.out" }, T.logo + 0.2)
        .fromTo("#bajada-a", { opacity: 0, scaleX: 1.35 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "expo.out" }, T.logo + 0.5);

      // 3. tomas de cuidados: entran con golpe de zoom y el nombre cae
      [["#v-color", "#t-color"], ["#v-nutri", "#t-nutri"], ["#v-fuerza", "#t-fuerza"], ["#v-kera", "#t-kera"]].forEach(([v, t], i) => {
        const a = T.lineas[i];
        flash(a, i === 0 ? 0.8 : 0.45);
        tl.fromTo(v, { scale: 1.18 }, { scale: 1.0, duration: 0.35, ease: "expo.out" }, a)
          .fromTo(letras($(t)), { opacity: 0, y: -80, scale: 1.4 }, { opacity: 1, y: 0, scale: 1, duration: 0.22, stagger: 0.012, ease: "back.out(2.2)" }, a + 0.02);
      });

      // 4. aminofusión
      flash(T.amino, 0.85);
      tl.fromTo("#amino-tit", { opacity: 0, scale: 1.5, filter: "blur(18px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" }, T.amino + 0.05)
        .fromTo("#pasos-txt", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, T.pasos)
        .fromTo("#pasos span", { opacity: 0, scale: 0, rotationY: 180, x: -60 }, { opacity: 1, scale: 1, rotationY: 0, x: 0, duration: 0.4, stagger: 0.15, ease: "back.out(2.5)" }, T.pasos + 0.15);

      // 5. blondifix: contador hasta 9
      flash(T.blond, 0.9);
      const num = { n: 1 };
      tl.fromTo("#cont", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, T.nueve - 0.8)
        .fromTo(num, { n: 1 }, { n: 9, duration: 0.8, ease: "power1.in", onUpdate: () => { $("#num").textContent = Math.round(num.n); } }, T.nueve - 0.8)
        .fromTo("#cont .n", { scale: 1 }, { scale: 1.3, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, T.nueve)
        .fromTo(letras($("#blond-nom")), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.04, ease: "expo.out" }, T.blond + 0.3);
      flash(T.nueve, 0.35);

      // 6. cierre
      flash(T.fin, 0.8);
      tl.fromTo("#p-b", { rotationY: 180, scale: 0.3 }, { rotationY: 0, scale: 0.75, duration: 0.7, ease: "expo.out" }, T.fin)
        .fromTo("#p-b", { rotationY: 0 }, { rotationY: -25, duration: 2.2, ease: "sine.inOut", immediateRender: false }, T.fin + 0.7)
        .fromTo(letras($("#marca-b")), { opacity: 0, z: 400, rotationY: 60, transformPerspective: 800 }, { opacity: 1, z: 0, rotationY: 0, duration: 0.4, stagger: 0.04, ease: "expo.out" }, T.fin + 0.2)
        .fromTo("#bajada-b", { opacity: 0, scaleX: 1.35 }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "expo.out" }, T.fin + 0.55)
        .fromTo("#web", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, T.fin + 0.8)
        .fromTo("#fila img", { y: 500, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, stagger: 0.07, ease: "back.out(1.5)" }, T.fin + 0.3)
        .fromTo("#fila", { scale: 1 }, { scale: 1.05, duration: 3, ease: "none" }, T.fin + 0.5)
        .to("#negro", { opacity: 1, duration: 0.4 }, T.total - 0.4);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
