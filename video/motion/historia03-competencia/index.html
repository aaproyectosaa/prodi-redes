<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --violeta: #6f40fc; --lila: #b9a4ff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: Inter, sans-serif; color: #fff; background: #000; }
      .esc { position: absolute; inset: 0; overflow: hidden; }

      /* universo de piezas */
      #s-uni { perspective: 1000px; background: radial-gradient(60% 40% at 50% 46%, #121018 0%, #000 75%); }
      #mundo { position: absolute; left: 540px; top: 900px; width: 0; height: 0; transform-style: preserve-3d; }
      #titular { position: absolute; left: -800px; top: -420px; width: 1600px; text-align: center; font-size: 190px; font-weight: 900; line-height: 0.92; letter-spacing: -0.045em; color: #fff; text-shadow: 0 10px 50px rgba(0,0,0,0.95), 0 0 2px rgba(0,0,0,0.6); backface-visibility: hidden; transform-style: preserve-3d; }
      #titular .w { display: inline-block; }
      .pz { position: absolute; left: -150px; top: -190px; width: 300px; height: 380px; border-radius: 22px; overflow: hidden; backface-visibility: hidden; }
      .pz .col, .pz .gris { position: absolute; inset: 0; }
      .pz .gris { background: #26252b; opacity: 0; }
      .pz .gris i { position: absolute; left: 18px; right: 18px; top: 18px; height: 200px; border-radius: 12px; background: #3a3940; }
      .pz .gris b { position: absolute; left: 18px; top: 236px; width: 200px; height: 18px; border-radius: 9px; background: #4a4950; }
      .pz .gris u { position: absolute; left: 18px; top: 266px; width: 140px; height: 14px; border-radius: 7px; background: #3a3940; }
      .pz .gris s { position: absolute; left: 18px; right: 18px; bottom: 18px; height: 50px; border-radius: 25px; background: #4a4950; }
      .pz .col b { position: absolute; border-radius: 50%; }
      .pz .col u { position: absolute; left: 22px; bottom: 26px; width: 150px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.9); }
      .pz .col s { position: absolute; left: 22px; top: 24px; width: 200px; height: 24px; border-radius: 12px; background: rgba(0,0,0,0.25); }
      #pila { position: absolute; inset: 0; }
      .cp { position: absolute; width: 340px; height: 430px; border-radius: 24px; background: #2a292f; box-shadow: 0 20px 60px rgba(0,0,0,0.7); overflow: hidden; }
      .cp i { position: absolute; left: 20px; right: 20px; top: 20px; height: 230px; border-radius: 14px; background: #3c3b42; }
      .cp b { position: absolute; left: 20px; top: 270px; width: 220px; height: 20px; border-radius: 10px; background: #4c4b52; }
      .cp s { position: absolute; left: 20px; right: 20px; bottom: 20px; height: 56px; border-radius: 28px; background: #4c4b52; }
      #ruido { position: absolute; inset: 0; background: #fff; opacity: 0; }

      /* la única pieza violeta */
      #s-unica { background: #000; perspective: 1600px; }
      #unica { position: absolute; left: 260px; top: 560px; width: 560px; height: 700px; border-radius: 40px; overflow: hidden; background: radial-gradient(120% 90% at 30% 15%, #9a78ff 0%, #6f40fc 35%, #2b1170 75%, #0f0630 100%); box-shadow: 0 0 0 2px rgba(255,255,255,0.18), 0 0 140px rgba(111,64,252,0.75), 0 0 320px rgba(111,64,252,0.35); transform-style: preserve-3d; }
      #unica .orbe { position: absolute; left: 330px; top: 170px; width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff 0%, #e6dcff 30%, rgba(185,164,255,0) 72%); }
      #unica .ar { position: absolute; left: 415px; top: 255px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.28); }
      #unica .barra { position: absolute; left: 48px; bottom: 60px; height: 10px; border-radius: 5px; background: rgba(255,255,255,0.7); }
      #reflejo { position: absolute; left: 260px; top: 1290px; width: 560px; height: 160px; border-radius: 40px; background: radial-gradient(60% 100% at 50% 0%, rgba(111,64,252,0.35), transparent 70%); filter: blur(10px); }
      .preg { position: absolute; left: 0; right: 0; text-align: center; font-size: 186px; font-weight: 900; letter-spacing: -0.05em; line-height: 1; }
      #p1 { top: 300px; } #p2 { top: 1300px; color: var(--lila); text-shadow: 0 0 50px rgba(111,64,252,0.7); }

      /* cierre */
      #s-logo { background: radial-gradient(70% 45% at 50% 46%, #1a0f3d 0%, #000 70%); }
      #logo { position: absolute; left: 50%; top: 760px; width: 860px; margin-left: -430px; }
      #redes { position: absolute; left: 0; right: 0; top: 1050px; display: flex; justify-content: center; }
      #redes span { padding: 14px 44px; border-radius: 999px; background: var(--violeta); font-size: 46px; font-weight: 900; letter-spacing: 0.32em; text-indent: 0.32em; }
      #lema { position: absolute; left: 0; right: 0; top: 1215px; text-align: center; font-size: 46px; font-weight: 800; letter-spacing: 0.08em; text-indent: 0.08em; color: rgba(255,255,255,0.9); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
      <audio id="mezcla" src="assets/mezcla.m4a" data-start="0" data-duration="10" data-track-index="9"></audio>

      <!-- 0–4.75: el universo de publicaciones que se vuelven iguales -->
      <div id="s-uni" class="esc clip" data-start="0" data-duration="4.75" data-track-index="0" data-layout-ignore>
        <div id="mundo"><div id="titular"><span class="w">TU</span><br /><span class="w">COMPETENCIA</span><br /><span class="w">TAMBIÉN</span><br /><span class="w">PUBLICA.</span></div></div>
        <div id="pila"></div>
        <div id="ruido"></div>
      </div>

      <!-- 5.75–8: una sola pieza violeta -->
      <div id="s-unica" class="esc clip" data-start="5.72" data-duration="2.4" data-track-index="0" data-layout-ignore>
        <div id="reflejo"></div>
        <div id="unica">
          <div class="ar" style="width:300px;height:300px;margin:-150px 0 0 -150px"></div>
          <div class="ar" style="width:460px;height:460px;margin:-230px 0 0 -230px"></div>
          <div class="orbe"></div>
          <div class="barra" style="width:300px"></div><div class="barra" style="width:200px;bottom:84px;opacity:0.5"></div>
        </div>
        <div id="p1" class="preg">¿POR QUÉ</div>
        <div id="p2" class="preg">A VOS?</div>
      </div>

      <!-- 8–10: logo -->
      <div id="s-logo" class="esc clip" data-start="8.05" data-duration="1.95" data-track-index="1" data-layout-ignore>
        <img id="logo" src="assets/logo-horizontal-blanco.png" />
        <div id="redes"><span>REDES</span></div>
        <div id="lema">NO EMPEZAMOS DE CERO.</div>
      </div>
      <div id="flash" class="clip" data-start="0" data-duration="10" data-track-index="8" data-layout-ignore></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const $ = (s, r = document) => r.querySelector(s);
      const $$ = (s, r = document) => [...r.querySelectorAll(s)];
      const flash = (t, o = 0.4, d = 0.25) => tl.fromTo("#flash", { opacity: o }, { opacity: 0, duration: d, ease: "power2.out", immediateRender: false }, t);
      let semilla = 23; const azar = () => ((semilla = (semilla * 16807) % 2147483647) / 2147483647);

      // piezas: cada una con su color (marca propia) y debajo la versión gris idéntica a todas
      const paletas = [["#ff4d4d", "#ffd23f"], ["#2fd3c4", "#0b3a44"], ["#ffb15c", "#ff5c8a"], ["#5aa0ff", "#0d2a5a"], ["#a6e22e", "#1f4d1a"], ["#ff7ad9", "#3b0a2e"], ["#ffffff", "#9aa0aa"], ["#ffd23f", "#2a2a2a"]];
      const N = 110; const mundo = $("#mundo"); const pz = [];
      for (let i = 0; i < N; i++) {
        const d = document.createElement("div"); d.className = "pz";
        const [a, b] = paletas[i % paletas.length];
        const r1 = 80 + azar() * 160;
        d.innerHTML = `<div class="col" style="background:linear-gradient(${Math.floor(azar() * 360)}deg, ${a}, ${b})"><b style="left:${azar() * 200}px;top:${60 + azar() * 140}px;width:${r1}px;height:${r1}px;background:rgba(255,255,255,0.25)"></b><s></s><u></u></div><div class="gris"><i></i><b></b><u></u><s></s></div>`;
        mundo.appendChild(d);
        const ang = azar() * Math.PI * 2, rad = 330 + azar() * 900;
        pz.push({ d, x: Math.cos(ang) * rad, y: Math.sin(ang) * rad * 1.45, z: -i * 110, r: (azar() - 0.5) * 24, v: 0.6 + azar() * 0.8, nace: azar() });
      }
      const LARGO = N * 110;
      const cam = { z: 0, cant: 0.35 };
      const pinta = () => {
        for (const p of pz) {
          const z = (((p.z + cam.z * p.v) % LARGO) + LARGO) % LARGO - LARGO + 650;
          p.d.style.transform = `translate3d(${p.x}px, ${p.y}px, ${z}px) rotateZ(${p.r}deg)`;
          const lejos = Math.min(1, (z + LARGO) / 3500);
          const tapa = cam.z < 7000 && z > -560 && Math.abs(p.x) < 760 && Math.abs(p.y) < 470;
          p.d.style.opacity = p.nace < cam.cant ? lejos * (tapa ? 0.22 : 1) : 0;
        }
      };
      pinta();
      // 0–3: viaje entre las piezas y cada vez hay más
      tl.fromTo(cam, { z: 0, cant: 0.35 }, { z: 5200, cant: 1, duration: 3.0, ease: "power1.inOut", onUpdate: pinta }, 0)
        // 3–4.75: acelera
        .fromTo(cam, { z: 5200 }, { z: 26000, duration: 1.75, ease: "power3.in", onUpdate: pinta, immediateRender: false }, 3.0)
        .fromTo("#mundo", { rotationZ: 0 }, { rotationZ: -10, duration: 4.75, ease: "power2.in" }, 0);
      // el mensaje, desde el primer segundo, adentro del universo: las piezas le pasan por delante y por detrás
      tl.fromTo("#titular", { z: -720, rotationZ: 0 }, { z: -430, rotationZ: 7.5, duration: 3.0, ease: "power1.inOut" }, 0)
        .fromTo($$("#titular .w"), { opacity: 0, y: 80, rotationX: 70 }, { opacity: 1, y: 0, rotationX: 0, duration: 0.45, stagger: 0.12, ease: "expo.out" }, 0.05)
        // late apenas con el pulso de la música
        .to("#titular", { scale: 1.035, duration: 0.25, yoyo: true, repeat: 5, ease: "sine.inOut" }, 0.6)
        // cuando todo acelera, el mensaje sale disparado hacia la cámara
        .to("#titular", { z: 700, rotationZ: 10, opacity: 0, duration: 0.6, ease: "power3.in", immediateRender: false }, 3.0);
      // todas empiezan a parecer iguales: el color se apaga y queda el mismo molde gris
      tl.to(pz.map((p) => $(".gris", p.d)), { opacity: 1, duration: 0.5, stagger: { each: 0.012, from: "random" } }, 1.3);
      // saturación: las piezas grises se apilan encima hasta tapar todo
      const pila = $("#pila"); const cps = [];
      for (let i = 0; i < 46; i++) {
        const c = document.createElement("div"); c.className = "cp"; c.innerHTML = "<i></i><b></b><s></s>"; pila.appendChild(c); cps.push(c);
        const x = -60 + azar() * 820, y = 120 + azar() * 1450, t = 3.5 + (i / 46) * 1.15;
        tl.fromTo(c, { x, y, scale: 0.2, rotation: (azar() - 0.5) * 40, opacity: 0 }, { scale: 1 + azar() * 0.5, rotation: (azar() - 0.5) * 14, opacity: 1, duration: 0.18, ease: "expo.out" }, t);
      }
      tl.fromTo("#ruido", { opacity: 0 }, { opacity: 0.08, duration: 0.6 }, 4.15);

      // corte seco a negro (4.75) y silencio: "La pregunta es…"

      // 5.75: queda una sola pieza violeta suspendida
      flash(5.72, 0.5, 0.2);
      tl.fromTo("#unica", { scale: 0.7, opacity: 0, rotationY: -25, rotationX: 8 }, { scale: 1, opacity: 1, rotationY: 0, rotationX: 0, duration: 0.7, ease: "expo.out" }, 5.72)
        .to("#unica", { rotationY: 9, rotationX: -4, y: -16, duration: 1.7, ease: "sine.inOut" }, 6.42)
        .fromTo("#unica .orbe", { scale: 0.6 }, { scale: 1, duration: 1.4, ease: "power2.out" }, 5.8)
        .fromTo("#unica .ar", { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 1.0, stagger: 0.15, ease: "power2.out" }, 5.85)
        .fromTo("#reflejo", { opacity: 0 }, { opacity: 1, duration: 0.8 }, 5.9)
        .fromTo("#p1", { opacity: 0, y: -40, scale: 1.15 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 6.05)
        .fromTo("#p2", { opacity: 0, y: 40, scale: 1.15 }, { opacity: 1, y: 0, scale: 1, duration: 0.4, ease: "expo.out" }, 6.3);
      // la pieza se da vuelta y se vuelve el logo
      tl.to(["#p1", "#p2", "#reflejo"], { opacity: 0, duration: 0.25 }, 7.75)
        .to("#unica", { rotationY: 90, scale: 0.6, duration: 0.3, ease: "power3.in" }, 7.8);
      flash(8.05, 0.35, 0.25);
      tl.fromTo("#logo", { opacity: 0, rotationY: -70, scale: 0.8, transformPerspective: 1600 }, { opacity: 1, rotationY: 0, scale: 1, duration: 0.5, ease: "expo.out" }, 8.05)
        .fromTo("#redes span", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2.2)" }, 8.35)
        .fromTo("#lema", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 8.6)
        .to("#logo", { scale: 1.03, duration: 1.4, ease: "none" }, 8.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
