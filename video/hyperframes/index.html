<!doctype html>
<html lang="es" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #111111; }
      #root { width: 100%; height: 100%; }
      #placa {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 72px;
        font-family: "Arial Black", Arial, sans-serif;
      }
      #logo { width: 640px; }
      #frase { color: #f4f4f5; font-size: 64px; text-align: center; line-height: 1.15; max-width: 860px; text-transform: uppercase; }
      #frase b { color: #ffd400; }
      #barra { width: 0; height: 10px; background: #8b5cf6; border-radius: 5px; }
    </style>
  </head>
  <body>
    <!-- Placa de cierre de PRODI. Para otra marca: cambiá assets/logo.png, el fondo y la frase. -->
    <div id="root" data-composition-id="main" data-start="0" data-duration="4" data-width="1080" data-height="1920">
      <div id="placa" class="clip" data-start="0" data-duration="4" data-track-index="0">
        <img id="logo" src="assets/logo.png" />
        <div id="barra"></div>
        <h1 id="frase">Tus redes, <b>en buenas manos</b></h1>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#logo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.7)" }, 0.1)
        .to("#barra", { width: 420, duration: 0.5, ease: "power2.out" }, 0.6)
        .fromTo("#frase", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0.9)
        .to("#placa", { opacity: 0, duration: 0.4 }, 3.6);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
