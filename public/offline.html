<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Prodi · Sin conexión</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fafafa;
         font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; margin: 20px 0 8px; }
  p { color: #a1a1aa; font-size: 14px; max-width: 280px; margin: 0 auto 20px; line-height: 1.5; }
  button { background: #6F40FC; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 15px; font-weight: 600; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="Prodi" />
    <h1>Sin conexión</h1>
    <p>Revisá el wifi o los datos del celular. Apenas vuelva la conexión, seguís donde estabas.</p>
    <button onclick="location.reload()">Reintentar</button>
  </main>
  <script>addEventListener('online', () => location.reload());</script>
</body>
</html>
